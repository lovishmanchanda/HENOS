name: Release

# Builds the installers. Runs when a version tag such as v0.1.0 is pushed, or
# by hand from the Actions tab. The result is a draft release with the
# installers attached; nothing is public until the draft is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the Tauri command-line tool
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: HENOS v__VERSION__
          releaseBody: Installers for macOS (Apple silicon), Windows and Android. See the README for what works today.
          releaseDraft: true
          prerelease: true

  android:
    name: Build (Android)
    # After the desktop builds, so the draft release already exists.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install Android build pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
          cargo install cargo-ndk --locked
      - name: Build the Rust core for phones
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: apps/android/build-rust.sh
      # With the signing secrets set, the app is signed with the project's
      # own key and can update over earlier releases. Without them it is
      # signed with a throwaway key: it installs, but cannot update in place.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HENOS_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/henos.jks"
          echo "HENOS_KEYSTORE=$RUNNER_TEMP/henos.jks" >> "$GITHUB_ENV"
      - name: Build the app
        working-directory: apps/android
        env:
          HENOS_KEYSTORE_PASSWORD: ${{ secrets.HENOS_KEYSTORE_PASSWORD }}
          HENOS_KEY_ALIAS: ${{ secrets.HENOS_KEY_ALIAS }}
          HENOS_KEY_PASSWORD: ${{ secrets.HENOS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      - name: Name the app file
        id: apk
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cp apps/android/app/build/outputs/apk/release/app-release.apk "HENOS_${version}_android.apk"
          echo "file=HENOS_${version}_android.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.apk.outputs.tag }}
          draft: true
          prerelease: true
          files: ${{ steps.apk.outputs.file }}
