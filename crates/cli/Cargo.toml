[package]
name = "henos-cli"
description = "Headless dev and test tool for HENOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "henos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
henos-clipboard-desktop.workspace = true
henos-core.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
