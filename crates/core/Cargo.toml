[package]
name = "henos-core"
description = "Shared core for henos: identity, discovery, transport, pairing and sync logic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
gethostname = "1.1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6"
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "fs", "io-util", "net"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
